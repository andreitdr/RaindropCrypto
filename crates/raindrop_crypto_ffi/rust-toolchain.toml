# The toolchain RaindropClient's build hook (native/raindrop_crypto_builder/hook/build.dart) builds
# this crate with, through native_toolchain_rust: an exact version, so an app build is reproducible,
# and every target the client ships. rustup installs both on first use.
#
# Only builds started inside this folder see this file. RaindropCrypto's own CI and `cargo` at the
# workspace root keep using the stable toolchain; bump this when that one moves on.
[toolchain]
channel = "1.99.1"
targets = [
    # macOS (Apple silicon only) and iOS (devices, and the simulator on Apple silicon)
    "aarch64-apple-darwin",
    "aarch64-apple-ios",
    "aarch64-apple-ios-sim",
    # Android
    "aarch64-linux-android",
    "armv7-linux-androideabi",
    "x86_64-linux-android",
    # Linux
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    # Windows
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]
