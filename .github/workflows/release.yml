name: Release

# Starts when release.sh pushes a version tag (vYY.M.P: year, month, patch). Builds and tests the tagged commit (ci.yml),
# packages the artefact, and only if all of that succeeded publishes a GitHub release for the tag
# with the artefact attached. GitHub adds the source-code zip itself.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  # Every platform must compile with no error and no warning (warnings are errors), and the tests
  # must pass, or nothing below runs and no release is published.
  ci:
    name: Build and test
    uses: ./.github/workflows/ci.yml

  package:
    name: Package (${{ matrix.name }})
    needs: ci
    strategy:
      matrix:
        include:
          - { name: linux, os: ubuntu-latest }
          - { name: macos, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release library
        run: cargo build --release --locked -p raindrop_crypto_ffi

      - name: Package
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          out="RaindropCrypto-$VERSION-${{ matrix.name }}"
          mkdir -p "$out/lib" dist
          cp target/release/libraindrop_crypto_ffi.{so,dylib,a} "$out/lib/" 2>/dev/null || true
          ls "$out/lib"
          tar -czf "dist/$out.tar.gz" "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: dist/*

  release:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release for the existing tag
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # The release notes are the changelog release.sh wrote into the annotated tag (its message minus
        # the subject line). A lightweight tag pushed by hand has none, so GitHub generates notes instead.
        run: |
          ref="$(gh api "repos/$GH_REPO/git/ref/tags/$GITHUB_REF_NAME")"
          if [ "$(jq -r .object.type <<< "$ref")" = tag ]; then
            gh api "repos/$GH_REPO/git/tags/$(jq -r .object.sha <<< "$ref")" --jq .message | tail -n +3 > notes.md
          fi
          if [ -f notes.md ] && grep -q '[^[:space:]]' notes.md; then
            notes=(--notes-file notes.md)
          else
            notes=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            "${notes[@]}"
